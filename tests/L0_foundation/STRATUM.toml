name = "Foundation"
order = 0
description = "Repository invariants that need no toolchain: the build definitions are present and self-contained, and the documented setup path exists."
enabled = true
concerns = ["build-system", "governance"]
objectives = ["Prove the repository can be built from a clean machine without MCUXpresso"]

[[subtests]]
id = "L0_001"
file = "test_L0_001_build_definitions.py"
name = "Build definitions"
description = "The competition preset, toolchain file, source list, linker captures, and vendored headers are present and self-contained"
test_case_type = "algorithmic"

[subtests.code_under_test]
module = "src/embedded/CMakePresets.json"

[subtests.test_functions]
test_presets_exist = "CMakePresets.json parses and defines the competition preset"
test_source_list_is_self_contained = "the committed source list references no MCUXpresso install path"
test_vendored_header_present = "cr_section_macros.h is in the repository, not only in the IDE"
test_linker_capture_documented = "the edited linker script explains the libnosys substitution"
test_no_ide_only_library = "no linker script pulls libcr_newlib_nohost.a"

[[subtests]]
id = "L0_002"
file = "test_L0_002_setup_contract.py"
name = "Setup contract"
description = "setup.ps1, root README, and component entry points agree with the tree"
test_case_type = "algorithmic"

[subtests.code_under_test]
module = "setup.ps1"

[subtests.test_functions]
test_setup_script_exists = "setup.ps1 is present and provisions the documented tools"
test_root_readme_routes_students_to_the_authoritative_setup_guide = "the repository landing page routes students to one setup guide"
test_student_setup_guide_uses_current_commands_and_paths = "the student guide uses only current setup, build, flash, viewer, and artifact paths"
test_student_setup_guide_covers_bounded_permission_and_recovery_help = "permission help is temporary and physical ROM recovery is explicit"
test_student_setup_guide_local_links_resolve = "the standalone setup guide's local stylesheet and navigation links resolve"
test_readmes_are_the_current_component_map = "the root README names each supported component build command"
test_only_competition_preset_is_student_facing = "the embedded component exposes one normal preset"

[[subtests]]
id = "L0_003"
file = "test_L0_003_setup_install.py"
name = "Verified setup install"
description = "setup.ps1 verifies, stages, installs, reruns, and rolls back the pinned Windows host runtime"
test_case_type = "algorithmic"

[subtests.code_under_test]
module = "setup.ps1"

[subtests.test_functions]
test_valid_local_archive_installs_and_rerun_is_idempotent = "a valid local archive installs and a second run is network-free"
test_preseeded_verified_cache_installs_without_network = "a preseeded verified cache installs without reaching the network"
test_outer_hash_mismatch_is_rejected_without_replacing_runtime = "an outer checksum mismatch cannot replace a known-good runtime"
test_inner_hash_mismatch_is_rejected_and_known_good_is_restored = "an invalid manifest payload cannot replace a known-good runtime"

[[subtests]]
id = "L0_013"
file = "test_L0_013_macos_setup_contract.py"
name = "macOS setup contract"
description = "The Apple Silicon bootstrap delegates safely to pinned shared setup behavior"
test_case_type = "algorithmic"

[subtests.code_under_test]
module = "setup.sh"

[subtests.test_functions]
test_macos_arm_toolchain_pin_matches_the_official_release = "the Apple Silicon Arm archive and compiler hashes are immutable"
test_shell_bootstrap_stays_thin_and_delegates_shared_setup = "setup.sh owns only prerequisite checks and delegation"
test_shared_setup_has_mac_archive_and_package_manager_boundaries = "shared setup preserves verified extraction and native package-manager boundaries"
test_shell_bootstrap_handles_a_repository_path_with_spaces = "the Mac bootstrap works from a checkout path containing spaces"
test_bootstrap_recovers_the_standard_apple_silicon_homebrew_path = "the standard Homebrew prefix is recovered without profile edits"
test_unpublished_mac_runtime_requires_an_explicit_skip = "setup cannot silently install or claim an unpinned Mac runtime"
