[project]
name = "nxp-cup"
version = "1.0.0"
description = "FRDM-MCXN947 NXP Cup firmware project."
readme = "README.md"
requires-python = ">=3.12,<3.13"

[dependency-groups]
dev = [
    "lizard>=1.23.0",
    "openpyxl>=3.1.5",
    "pylink-square>=2.0.0",
    "pymupdf>=1.28.0",
    "pytest>=8.0",
    "wn-dev-std==2026.7.18",
]

[tool.uv]
package = false

[tool.wn_dev_std]
standard_version = "2026.7.18"
profile = "zephyr-firmware"
distribution = "none"
languages = ["c", "asm", "powershell", "markdown"]
strict = false
artifact_policy = "custom"

[tool.wn_dev_std.signoff]
suite = "tests"
strata = ["L99_signoff"]
runner = "uv run rack run L99"

[tool.wn_dev_std.documentation.plans]
roots = ["docs/plans"]
ignore = [
    "docs/examples",
    "docs/research",
]
